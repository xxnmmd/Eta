name: Context Window Fix Build
on:
  push:
    branches: [fix/context-window-v3.1.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"
      - name: Restore release keystore
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" || -z "$ETA_RELEASE_STORE_PASSWORD" || -z "$ETA_RELEASE_KEY_ALIAS" || -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Missing release signing secrets."
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eta-release.jks"
      - name: Run unit tests
        run: ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest
      - name: Build APKs
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug :app:assembleRelease
      - name: Verify and collect APKs
        id: apk
        run: |
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"
          out="$RUNNER_TEMP/apks"
          mkdir -p "$out"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$debug_apk"
          test -f "$release_apk"
          "$apksigner_path" verify "$release_apk"
          cp "$debug_apk" "$out/app-debug.apk"
          cp "$release_apk" "$out/app-release.apk"
          echo "debug_path=$out/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "release_path=$out/app-release.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eta-v3.1.0-context-window-fix
          path: |
            ${{ steps.apk.outputs.debug_path }}
            ${{ steps.apk.outputs.release_path }}
          if-no-files-found: error
          retention-days: 14
