name: Context Window Fix Build
on:
  push:
    branches: [fix/context-window-v3.1.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"
      - name: Run regression tests
        run: ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest --tests io.github.mangi.eta.agent.model.AgentContextCompactionTest --tests io.github.mangi.eta.agent.runtime.AgentRuntimePolicyTest
      - name: Build Debug APK
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eta-v3.1.0-context-window-fix-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
